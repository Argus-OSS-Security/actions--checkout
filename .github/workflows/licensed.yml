name: Licensed

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   push: {branches: main}
#   pull_request: {branches: main}
# 
jobs:
  test:
    runs-on: ubuntu-latest
    name: Check licenses
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run licensed-check